<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="shortcut icon" th:href="@{/thymeleaf/favicon.png}">
    <link rel="stylesheet" th:href="@{/thymeleaf/style.css}">
    <title>Login</title>
</head>
<body>
<header>
    <a th:href="@{/}"><img id="logo" th:src="@{/thymeleaf/images/logo.png}" alt="Logo"></a>
</header>
<hr class="content-divider"/>
<main>
    <div class="form-container">

        <h1>Welcome</h1>
        <p>Sign in to your account</p>

        <div th:if="${param.error}" class="alert alert-error">
            Invalid username or password
        </div>

        <div th:if="${param.logout}" class="alert alert-success">
            You have been logged out
        </div>

        <div th:if="${param.registered}" class="alert alert-success">
            Registration successful. Please sign in!
        </div>

        <form th:action="@{/mvc/login}" method="post">

            <div class="form-group">
                <label for="username">Username</label>
                <input
                        type="text"
                        id="username"
                        name="username"
                        placeholder="Enter your username"
                        required>
            </div>

            <div class="form-group">
                <label for="password">Password</label>
                <input
                        type="password"
                        id="password"
                        name="password"
                        placeholder="Enter your password"
                        required>
            </div>

            <div id="rememberMe-container">
                <input type="checkbox"
                       id="rememberMe"
                       name="rememberMe"
                       value="true"/>
                <label for="rememberMe">Remember me</label>
            </div>

            <button type="submit" class="form-btn">
                Sign In
            </button>

        </form>

        <div class="extra-links">
            <p>
                Don't have an account?
                <a th:href="@{/mvc/register}">Register</a>
            </p>
        </div>

    </div>
</main>
<hr class="content-divider"/>
<footer>
    <p>&copy; 2026 All rights reserved.</p>
</footer>
</body>
</html>
