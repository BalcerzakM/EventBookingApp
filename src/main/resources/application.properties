spring.application.name=EventBookingApp

spring.datasource.url=jdbc:mysql://localhost:3306/EventApp?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=app_admin
spring.datasource.password=pass_admin

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

app.security.remember-me.key=EventBookingAppPassXD

springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs